<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header__inner">
            <a href="/" class="header__logo">
                <img class="header__logo-icon" src="/src/logo.png" alt="teaboom">
                <div class="header__logo-text">
                    <span class="header__logo-title">Чайный Бум</span>
                    <span class="header__logo-subtitel">Интернет-магазин чая и посуды</span>
                </div>
            </a>
            <div class="header_contacts">
                <a href="+74951201551" class="header__phone">+7 (495) 120-15-51</a>
                <a href="email:info@teaboom.ru" class="header__email">info@teaboom.ru</a>
                <div class="header__schedule">
                    <span>пн - пт с 10:00 до 19:00 </span>
                    <span>сб - вс с 12:00 до 16:00</span>
                </div>
            </div>

            <div class="header__action">
                <a href="/" class="header__cart">
                    <img src="src/shop-cart.png" alt="shop-cart" class="header__shopcart-image">
                </a>
                <span class="header__cart-count">0</span>
            </div>

        </div>
    </header>
    <script src="script.js"></script>
</body>
</html>
